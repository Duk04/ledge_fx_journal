# Hourly trigger for /api/cron/notifications — the fallback for hosts whose
# own cron cannot run hourly (Vercel's Hobby plan runs a cron at most once a
# day). Does nothing until both repository secrets are set:
#   LEDGER_URL   the deployed origin, e.g. https://ledger.example.com
#   CRON_SECRET  the same value as the app's CRON_SECRET
# Running both this and an hourly Vercel cron is harmless: each send is
# claimed once per period (docs/NOTIFICATIONS.md).
name: notifications

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the cron route
        env:
          LEDGER_URL: ${{ secrets.LEDGER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$LEDGER_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "LEDGER_URL / CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$LEDGER_URL/api/cron/notifications"
